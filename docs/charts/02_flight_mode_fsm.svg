<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" style="max-width:620px; width:100%;">
    <text x="310" y="18" font-family="Arial" font-size="10" font-weight="bold" fill="#1a365d" text-anchor="middle">Flight Mode FSM — 4 States</text>

    <!-- ACRO state -->
    <ellipse cx="110" cy="90" rx="70" ry="34" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="110" y="84" font-family="Arial" font-size="8.5" fill="#1a365d" text-anchor="middle" font-weight="bold">MODE_ACRO</text>
    <text x="110" y="96" font-family="Arial" font-size="7" fill="#4a5568" text-anchor="middle">[00] Rate Only</text>
    <text x="110" y="107" font-family="Arial" font-size="7" fill="#4a5568" text-anchor="middle">Outer Loop OFF</text>

    <!-- STABILIZE state -->
    <ellipse cx="320" cy="90" rx="78" ry="34" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
    <text x="320" y="84" font-family="Arial" font-size="8.5" fill="#1a365d" text-anchor="middle" font-weight="bold">MODE_STABILIZE</text>
    <text x="320" y="96" font-family="Arial" font-size="7" fill="#4a5568" text-anchor="middle">[01] Self-Level</text>
    <text x="320" y="107" font-family="Arial" font-size="7" fill="#4a5568" text-anchor="middle">Outer Att-P ON</text>

    <!-- ALT_HOLD state -->
    <ellipse cx="510" cy="90" rx="78" ry="34" fill="#fffbeb" stroke="#d69e2e" stroke-width="2"/>
    <text x="510" y="84" font-family="Arial" font-size="8.5" fill="#1a365d" text-anchor="middle" font-weight="bold">MODE_ALT_HOLD</text>
    <text x="510" y="96" font-family="Arial" font-size="7" fill="#4a5568" text-anchor="middle">[10] Altitude PID</text>
    <text x="510" y="107" font-family="Arial" font-size="7" fill="#4a5568" text-anchor="middle">Vert-Z channel ON</text>

    <!-- FAILSAFE state -->
    <ellipse cx="310" cy="185" rx="85" ry="30" fill="#fff5f5" stroke="#e53e3e" stroke-width="2.5"/>
    <text x="310" y="180" font-family="Arial" font-size="8.5" fill="#e53e3e" text-anchor="middle" font-weight="bold">MODE_FAILSAFE</text>
    <text x="310" y="192" font-family="Arial" font-size="7" fill="#c53030" text-anchor="middle">[11] Safe Descent Throttle</text>

    <!-- ACRO → STABILIZE -->
    <path d="M 180 80 Q 240 60 242 80" fill="none" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    <text x="218" y="67" font-family="Arial" font-size="6.5" fill="#718096" text-anchor="middle">mode_cmd=01</text>

    <!-- STABILIZE → ACRO -->
    <path d="M 242 100 Q 210 120 180 100" fill="none" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    <text x="218" y="120" font-family="Arial" font-size="6.5" fill="#718096" text-anchor="middle">mode_cmd=00</text>

    <!-- STABILIZE → ALT_HOLD -->
    <path d="M 398 80 Q 445 60 433 80" fill="none" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    <text x="430" y="67" font-family="Arial" font-size="6.5" fill="#718096" text-anchor="middle">mode_cmd=10</text>

    <!-- ALT_HOLD → STABILIZE -->
    <path d="M 433 100 Q 420 120 398 100" fill="none" stroke="#4a5568" stroke-width="1.2" marker-end="url(#arrowhead)"/>
    <text x="430" y="120" font-family="Arial" font-size="6.5" fill="#718096" text-anchor="middle">mode_cmd=01</text>

    <!-- Any → FAILSAFE (watchdog / tilt) -->
    <path d="M 110 124 Q 100 165 225 182" fill="none" stroke="#e53e3e" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
    <text x="108" y="162" font-family="Arial" font-size="6.5" fill="#e53e3e" text-anchor="middle">WDG / Tilt</text>

    <path d="M 320 124 L 320 155" fill="none" stroke="#e53e3e" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
    <text x="328" y="143" font-family="Arial" font-size="6.5" fill="#e53e3e">WDG / Tilt</text>

    <path d="M 510 124 Q 525 165 395 183" fill="none" stroke="#e53e3e" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
    <text x="518" y="162" font-family="Arial" font-size="6.5" fill="#e53e3e" text-anchor="middle">WDG / Tilt</text>

    <!-- FAILSAFE → STABILIZE (re-arm) -->
    <path d="M 370 170 Q 430 140 400 108" fill="none" stroke="#38a169" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowhead)"/>
    <text x="428" y="145" font-family="Arial" font-size="6.5" fill="#38a169" text-anchor="middle">Pilot Re-Arm</text>

    <!-- Legend -->
    <line x1="16" y1="208" x2="36" y2="208" stroke="#4a5568" stroke-width="1.2"/>
    <text x="40" y="212" font-family="Arial" font-size="7" fill="#4a5568">Normal transition (mode_cmd register)</text>
    <line x1="240" y1="208" x2="260" y2="208" stroke="#e53e3e" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="264" y="212" font-family="Arial" font-size="7" fill="#e53e3e">Fault / Emergency transition</text>
    <line x1="440" y1="208" x2="460" y2="208" stroke="#38a169" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="464" y="212" font-family="Arial" font-size="7" fill="#38a169">Re-arm after fault</text>
  </svg>